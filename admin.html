<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal - Medical Facility</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
    <script src="./app.js" defer></script>
  </head>

  <body>
    <div id="app">
      <div class="container" style="padding-top: 20px;">
        <a class="btn btn-secondary" style="max-width:240px; margin: 0 auto 20px; display:block; text-align:center;" href="./index.html">
          Back to Home
        </a>
      </div>

      <!-- Admin Login (default) -->
      <div id="adminLogin">
        <div class="container">
          <div class="card login-form">
            <h2 style="text-align: center; color: #14b8a6;">Admin Login</h2>
            <div id="loginError" class="error-message"></div>
            <form id="loginForm">
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="adminUsername" placeholder="example@clinic.com" required />
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" required />
              </div>
              <button type="submit" class="btn btn-primary">Login</button>
              <p style="margin-top:12px; color:#666; font-size:13px;">
                Demo-only admin auth. For real security, use a backend.
              </p>
            </form>
          </div>
        </div>
      </div>

      <!-- Admin Dashboard -->
      <div id="adminDashboard" style="display: none;">
        <div class="container">
          <div class="header">
            <h1>Admin Dashboard</h1>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>

          </div>

          <div class="card" style="margin-bottom: 20px;">
            <h2>Statistics</h2>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:20px; text-align:center;">
              <div style="background:#f0fdfa; padding:20px; border-radius:8px;">
                <h3 style="margin:0; color:#14b8a6; font-size:32px;" id="pendingCount">0</h3>
                <p style="margin: 5px 0 0 0; color:#666;">Pending</p>
              </div>
              <div style="background:#d1fae5; padding:20px; border-radius:8px;">
                <h3 style="margin:0; color:#10b981; font-size:32px;" id="approvedCount">0</h3>
                <p style="margin: 5px 0 0 0; color:#666;">Approved</p>
              </div>
              <div style="background:#f3f4f6; padding:20px; border-radius:8px;">
                <h3 style="margin:0; color:#374151; font-size:32px;" id="totalCount">0</h3>
                <p style="margin: 5px 0 0 0; color:#666;">Total Customers</p>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="nav-tabs">
              <button class="nav-tab active" onclick="switchTab('pending')">Pending</button>
              <button class="nav-tab" onclick="switchTab('confirmed')">Approved</button>
              <button class="nav-tab" onclick="switchTab('all')">All Bookings</button>
            </div>
            <div id="bookingsList" class="booking-list"></div>
          </div>
        </div>
      </div>

    </div>
  </body>
</html>
