<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Portal - Medical Facility</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
    <script src="./app.js" defer></script>
  </head>

  <body>
    <div id="app">
      <div class="container" style="padding-top: 20px;">
        <a class="btn btn-secondary" style="max-width:240px; margin: 0 auto 20px; display:block; text-align:center;" href="./index.html">
          Back to Home
        </a>
      </div>

      <!-- Customer Authentication (default) -->
      <div id="customerAuth">
        <div class="container">
          <div class="card login-form">
            <div class="nav-tabs" style="margin-bottom: 20px;">
              <button class="nav-tab active" onclick="switchAuthTab('login')">Login</button>
              <button class="nav-tab" onclick="switchAuthTab('register')">Register</button>
            </div>

            <!-- Customer Login -->
            <div id="customerLogin">
              <h2 style="text-align: center; color: #14b8a6;">Customer Login</h2>
              <div id="customerLoginError" class="error-message"></div>
              <form id="customerLoginForm">
                <div class="form-group">
                  <label>Email</label>
                  <input type="email" id="customerEmail" placeholder="your@email.com" required />
                </div>
                <div class="form-group">
                  <label>Password</label>
                  <input type="password" id="customerPassword" placeholder="Enter password" required />
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
              </form>
            </div>

            <!-- Customer Registration -->
            <div id="customerRegister" style="display: none;">
              <h2 style="text-align: center; color: #14b8a6;">Create Account</h2>
              <div id="customerRegisterError" class="error-message"></div>
              <div id="customerRegisterSuccess" class="success-message"></div>
              <form id="customerRegisterForm">
                <div class="form-group">
                  <label>Full Name</label>
                  <input type="text" id="registerName" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                  <label>Email</label>
                  <input type="email" id="registerEmail" placeholder="your@email.com" required />
                </div>
                <div class="form-group">
                  <label>Phone</label>
                  <input type="tel" id="registerPhone" placeholder="+1234567890" required />
                </div>
                <div class="form-group">
                  <label>Password</label>
                  <input type="password" id="registerPassword" placeholder="Create password" required />
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Customer Dashboard -->
      <div id="customerDashboard" style="display: none;">
        <div class="container">
          <div class="header">
            <h1 id="customerWelcome">My Appointments</h1>
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="showBookingForm()" style="max-width: 220px;">
                Book New Appointment
              </button>
              <button class="btn btn-secondary" onclick="customerLogout()">Logout</button>

            </div>
          </div>

          <div class="card">
            <h2>Your Appointments</h2>
            <div id="customerBookingsList" class="booking-list"></div>
          </div>
        </div>
      </div>

      <!-- Customer Booking Form -->
      <div id="customerBookingForm" style="display: none;">
        <div class="container">
          <div class="header">
            <h1>Book New Appointment</h1>
            <button class="btn btn-secondary" onclick="showCustomerDashboard()" style="max-width: 220px; margin: 20px auto 0;">
              Back to Dashboard
            </button>
          </div>

          <div class="main-content">
            <div class="card">
              <h2 id="customerBookingTitle">Book Your Appointment</h2>
              <div id="customerSuccessMessage" class="success-message"></div>
              <div id="customerErrorMessage" class="error-message"></div>

              <form id="customerBookingFormEl">
                <div class="form-group">
                  <label id="customerServiceLabel">Select Service</label>
                  <select id="customerServiceSelect" required>
                    <option value="">Choose a service...</option>
                    <option value="dermatology">Dermatology</option>
                    <option value="stomatology">Stomatology</option>
                    <option value="solarium">Solarium</option>
                  </select>
                </div>

                <div class="form-group" id="procedureGroup" style="display: none;">
                  <label>Select Procedure</label>
                  <select id="customerProcedureSelect">
                    <option value="">Choose a procedure...</option>
                  </select>
                </div>

                <div class="form-group">
                  <label>Select Date</label>
                  <input type="date" id="customerDateInput" required />
                </div>

                <div class="form-group">
                  <label>Available Time Slots</label>
                  <div id="customerTimeSlots" class="time-slots"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="customerSubmitBtn">Book Appointment</button>
              </form>
            </div>

            <div class="card">
              <h2>Service Information</h2>
              <div id="serviceInfo">
                <p style="color: #666; text-align:center; padding:20px;">
                  Select a service to see available procedures
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </body>
</html>
